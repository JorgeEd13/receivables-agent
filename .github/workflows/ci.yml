name: CI

# This repo had no workflow at all until ADR-022: the tests and the guardrail
# suite only ever ran when someone remembered to run them locally. The SQL guard
# is the security surface of this project — it needs a gate that runs whether or
# not anyone remembers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (package + dev extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: ruff
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # `mcp` is included on purpose: without it `tests/test_mcp.py` fails at
      # COLLECTION and the whole suite reports an error instead of running. The
      # suite must not depend on which extras a given machine happens to have.
      # `data` (faker) is here for the same reason: `tests/test_schema_hints.py`
      # generates a real ledger to check the prompt's schema map against, and the
      # committed ledger is git-ignored — so CI is exactly where that drift would
      # otherwise go unwatched.
      - name: Install (package + dev, mcp and data extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,data]"

      # `tests/test_plan_routing.py` measures where the *production* MiniLM puts
      # two real questions relative to the cache threshold (ADR-009 Amendment
      # 2026-08-01) — a claim the deterministic stand-in cannot make. That needs
      # the ONNX model ChromaDB downloads once. Cached here so the routing suite
      # is a gate that runs every time, not one that skips when the network is
      # slow: a routing test that quietly skips is the absent owner it replaced.
      - name: Cache the ONNX MiniLM embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma/onnx_models
          key: chroma-onnx-minilm-v1

      # Offline by construction: no LLM provider extra is installed, so a test
      # that reaches for a live model fails here instead of passing quietly on a
      # machine that happens to have Ollama running.
      - name: Run tests (offline)
        run: python -m pytest -q

      # The guardrail suite is called out separately so a break in the security
      # surface is legible in the run list, not buried in the full count.
      - name: Guardrail suite (security surface)
        run: python -m pytest tests/test_sql_guard.py tests/test_sql_guard_adversarial.py -q
