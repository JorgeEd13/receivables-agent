[project]
name = "receivables-agent"
version = "0.1.0"
description = "A conversational AI agent over accounts-receivable data: guarded text-to-SQL + RAG over a collections policy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jorge Ribeiro" }]

# Runtime dependencies are added per phase — see PLAN.md.
# Phase 1: duckdb (engine), faker (dimensions)  ✅
# Phase 2: langgraph, langchain-core, pydantic-settings  ✅
# Phase 3: chromadb (RAG over the policy; bundled local ONNX embeddings)  ✅
# Phase 4: fastapi, uvicorn (HTTP service wrapping the agent)  ✅
# Phase 5: mcp (AI-native layer; optional extra below)  ✅
dependencies = [
    "duckdb>=1.1",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "pydantic>=2",
    "pydantic-settings>=2",
    "chromadb>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Synthetic data generation (Phase 1). Only needed to (re)build the ledger.
data = ["faker>=30"]
# LLM providers (Phase 2). Install the one(s) you run; the agent imports them
# lazily, so Ollama-only or Gemini-only setups both work.
gemini = ["langchain-google-genai>=2"]
ollama = ["langchain-ollama>=0.2"]
# AI-native layer (Phase 5): the MCP server exposing the ledger as a tool. Not
# needed by the web/API container, so it's optional.
mcp = ["mcp>=1.2"]
# Test/dev tooling. httpx powers FastAPI's TestClient (API tests run offline).
dev = ["pytest", "httpx>=0.27", "ruff>=0.16", "mypy>=1.14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# --------------------------------------------------------------------------- #
# Static analysis. Enforced in CI — see .github/workflows/ci.yml.
# The rule set is curated rather than "ALL": every rule here is one the repo
# actually passes, so a red gate always means a new defect, never a backlog.
# Widening the set is a deliberate change, not a wish (see docs/DECISIONS.md).
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "PIE", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings — the reports use box-drawing glyphs
    "RUF002",
    "RUF003",
    "SIM108",  # ternary is not always more readable than if/else
    # E501 is deliberately OFF. `ruff format` is NOT enforced here: reformatting
    # ~33k lines would rewrite history for `git blame`, and the commit log is a
    # working engineering record. Without a formatter, line length is the least
    # informative rule in the set, and every real violation left is an embedded
    # CSS/JS block, a base64 asset or a test fixture — none of which read better
    # wrapped. The rules that catch defects (F, B, UP, SIM, RET, C4, RUF) stay on.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom IS a function call in an argument default
# (`user = Depends(auth)`). Ruff's B008 is right in general and wrong for FastAPI
# route signatures specifically.
"src/api/app.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
# Set to 3.12 because numpy's shipped stubs use PEP 695 `type` statements that
# mypy refuses to parse under an older target — it fails on the stub before it ever
# reaches this code. The package still supports 3.11; that is proven by the CI test
# matrix running there, which is a stronger check than a type-checker flag.
python_version = "3.12"
files = ["src"]
# SCOPE, stated because it is easy to read this gate as broader than it is: only
# `src/` is checked. Test code is NOT type-checked (running mypy over tests/ today
# reports errors). Widening it is real work, not a flag flip, and is queued rather
# than claimed. "mypy clean" here means "src/ is clean".
ignore_missing_imports = true
# Ratchet, not a wall: these are the levels the code passes TODAY and CI holds.
# Tightening happens per-module (see [[tool.mypy.overrides]]) so the gate stays
# green and every step forward is a real, reviewed change.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
